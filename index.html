<!DOCTYPE html>
<!-- Created By Mahmoud El Sheikh -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mahmoud El Sheikh</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#9c7a54">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Raleway:wght@200;300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --desk:       #9c7a54;
      --paper:      #f5ead9;
      --paper-edge: #e6d2b0;
      --ink:        #45311f;
      --ink-soft:   rgba(69,49,31,.62);
      --ink-faint:  rgba(69,49,31,.32);
      --rule:       rgba(69,49,31,.20);
      --accent:     #96603a;
    }

    html, body {
      min-height: 100vh; width: 100%;
      background: var(--desk);
      font-family: 'Raleway', sans-serif;
      color: var(--ink);
    }

    body {
      display: flex;
      justify-content: center;
      padding: clamp(24px, 6vw, 56px) 16px;
      padding-top: max(env(safe-area-inset-top, 0px), clamp(24px, 6vw, 56px));
      padding-bottom: max(env(safe-area-inset-bottom, 0px), clamp(24px, 6vw, 56px));
      padding-left: max(env(safe-area-inset-left, 0px), 16px);
      padding-right: max(env(safe-area-inset-right, 0px), 16px);
    }

    /* ── PAGE ── */
    .page {
      width: 100%;
      max-width: 480px;
      background: var(--paper);
      border: 1px solid var(--paper-edge);
      box-shadow: 0 1px 2px rgba(69,49,31,.15), 0 24px 48px rgba(43,30,18,.25);
      padding: clamp(28px, 6vw, 40px) clamp(22px, 6vw, 36px) clamp(20px, 5vw, 30px);
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      position: relative;
    }
    .avatar {
      flex-shrink: 0;
      width: clamp(56px, 14vw, 66px); height: clamp(56px, 14vw, 66px); border-radius: 50%;
      border: 1px solid var(--ink-faint);
      display: flex; align-items: center; justify-content: center;
      background: var(--paper-edge);
    }
    .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .monogram {
      font-family: 'Cinzel', serif; font-size: clamp(18px, 4vw, 22px); font-weight: 600;
      color: var(--accent);
    }
    .head-text { flex: 1; min-width: 140px; }
    .name {
      font-family: 'Cinzel', serif; font-weight: 600;
      font-size: clamp(18px, 4.5vw, 21px); letter-spacing: .5px;
      color: var(--ink);
    }
    .role {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 14.5px; color: var(--ink-soft);
      margin-top: 3px;
    }
    .contact-links {
      display: flex; gap: 10px; align-items: center;
    }
    .contact-links a {
      text-decoration: none; color: var(--ink-soft); font-size: 14px;
      transition: color .25s;
    }
    .contact-links a:hover, .contact-links a:focus-visible { color: var(--accent); }

    /* ── RULE ── */
    .rule { border: none; height: 1px; background: var(--rule); margin: 24px 0; }

    /* ── SECTION HEADING ── */
    .sec-heading {
      font-family: 'Cinzel', serif; font-variant: small-caps;
      font-size: 15px; letter-spacing: .5px; font-weight: 600;
      color: var(--accent); margin-bottom: 14px;
    }

    /* ── PROJECTS ── */
    .projects-container {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px;
    }
    .project-card {
      background: var(--paper); border: 1px solid var(--paper-edge);
      box-shadow: 0 1px 2px rgba(69,49,31,.15);
      padding: 12px;
      text-align: center;
    }
    .project-card h3 {
      font-family: 'Cinzel', serif; font-size: 16px; font-weight: 600;
      color: var(--ink);
    }
    .project-card p {
      font-family: 'Cormorant Garamond', serif; font-size: 14px; color: var(--ink-soft);
    }
    .project-card a {
      display: inline-block; margin-top: 12px; text-decoration: none; color: var(--accent);
      font-size: 14px; font-weight: 600;
    }

    /* ── FOOTER ── */
    .doc-foot {
      text-align: center; font-size: 11px;
      color: var(--ink-faint); letter-spacing: .3px;
    }
    .doc-foot span { color: var(--accent); }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: var(--ink); color: var(--paper);
      font-size: 12px; letter-spacing: .5px;
      padding: 9px 20px; border-radius: 4px;
      opacity: 0; transition: all .4s; z-index: 200; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .proj:hover, .proj:focus-visible { border-color: var(--accent); }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    @media (max-width: 420px) {
      body { padding-left: max(env(safe-area-inset-left, 0px), 10px); padding-right: max(env(safe-area-inset-right, 0px), 10px); }
    }

    @media (min-width: 640px) {
      .page { max-width: 520px; }
    }

    @media print {
      html, body { background: #fff; padding: 0; }
      .page { box-shadow: none; border: none; max-width: 100%; }
      .share-btn, .toast { display: none; }
    }
  </style>
</head>
<body>

<div class="page" id="page">

  <!-- HEADER -->
  <header class="header">
    <div class="avatar"><span class="monogram">M4S</span></div>
    <div class="head-text">
      <h1 class="name">Mahmoud El Sheikh</h1>
      <p class="role">System Administrator</p>
    </div>
    <div class="contact-links">
      <a href="https://www.facebook.com/profile.php?id=100063828772165" target="_blank" title="Facebook"><i class="fas fa-facebook-f"></i></a>
      <a href="https://x.com/Mahmoud13965642?t=N08ovBaf-OpU5B1-ifXbpg&s=09" target="_blank" title="X / Twitter"><i class="fab fa-x-twitter"></i></a>
      <a href="https://instagram.com/mhmoud_el_sheikh?igshid=dHg4Z3BiOTB3eWxj" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="https://wa.me/+201151754248" target="_blank" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
      <a href="https://t.me/mahmoud_elsheikh_Zsc" target="_blank" title="Telegram"><i class="fab fa-telegram"></i></a>
    </div>
  </header>

  <hr class="rule">

  <!-- PROJECTS -->
  <section>
    <h2 class="sec-heading">Projects</h2>
    <div class="projects-container" id="projects-container">
      <!-- Projects will be dynamically added here -->
    </div>
  </section>

  <hr class="rule">

  <div class="doc-foot">Copyright &copy; 2025 <span>Mahmoudelsheikh&reg;</span></div>
</div>

<div class="toast" id="toast"></div>

<script>
function shareCard() {
  const url = window.location.href;
  if (navigator.share) { navigator.share({ title:'Mahmoud El Sheikh', url }); }
  else { navigator.clipboard.writeText(url).then(()=> toast('Link copied')); }
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=> el.classList.remove('show'), 2400);
}

// Function to load projects from a text file
function loadProjects() {
  fetch('text/projects.txt')
    .then(response => response.text())
    .then(data => {
      const projects = data.split('\n').filter(line => line.trim() !== '');
      const projectsContainer = document.getElementById('projects-container');
      projects.forEach(project => {
        const [title, desc, link] = project.split('|');
        const card = document.createElement('div');
        card.classList.add('project-card');
        card.innerHTML = `
          <h3>${title}</h3>
          <p>${desc}</p>
          <a href="${link}" target="_blank">${title}</a>
        `;
        projectsContainer.appendChild(card);
      });
    })
    .catch(error => {
      const projectsContainer = document.getElementById('projects-container');
      projectsContainer.innerHTML = '<p>Error loading projects. Please try again later.</p>';
    });
}

// Call the function to load projects when the page loads
document.addEventListener('DOMContentLoaded', loadProjects);
</script>
</body>
</html>
