<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahmoud El Sheikh</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --bg-color: #f4ebd8;
    --text-color: #2c2724;
    --accent-color: #7b291a;
    --border-color: #c2b59b;
    --container-bg: rgba(255, 253, 248, 0.6);
    --bg-pattern: radial-gradient(circle at center, transparent 0%, rgba(200, 185, 155, 0.2) 100%);
}
[data-theme="dark"] {
    /* Eye-friendly dark mode colors */
    --bg-color: #1a1816; 
    --text-color: #d8cebd; 
    --accent-color: #bfa15f; 
    --border-color: #8c7646; 
    --container-bg: rgba(36, 33, 30, 0.9);
    --bg-pattern: radial-gradient(circle at center, transparent 0%, rgba(191, 161, 95, 0.04) 100%);
}
body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: 'Playfair Display', serif;
    line-height: 1.8;
    margin: 0;
    padding: 60px 20px;
    background-image: var(--bg-pattern);
    display: flex;
    justify-content: center;
    transition: all 0.5s ease;
}
.cv-container {
    max-width: 750px;
    width: 100%;
    padding: 60px 50px;
    border: 2px solid var(--border-color);
    outline: 1px solid var(--border-color);
    outline-offset: 6px;
    position: relative;
    background-color: var(--container-bg);
    box-shadow: inset 0 0 40px rgba(0,0,0,0.03), 0 10px 30px rgba(0,0,0,0.1);
    transition: all 0.5s ease;
}
.cv-container::before, .cv-container::after {
    content: '۞';
    position: absolute;
    color: var(--accent-color);
    font-size: 32px;
    transition: color 0.5s ease;
}
.cv-container::before {
    top: -22px;
    right: 20px;
    background: var(--bg-color);
    padding: 0 15px;
}
.cv-container::after {
    bottom: -22px;
    left: 20px;
    background: var(--bg-color);
    padding: 0 15px;
}
h1, h2, h3 {
    font-weight: 700;
    color: var(--accent-color);
    text-align: center;
    transition: color 0.5s ease;
}
h1 {
    font-size: 2.5em;
    margin: 0 0 5px 0;
}
.alias {
    text-align: center;
    font-size: 1.2em;
    font-style: italic;
    margin-bottom: 25px;
    color: var(--text-color);
    transition: color 0.5s ease;
}
.contact-links {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-bottom: 45px;
}
.contact-links a {
    font-size: 1.5em;
    color: var(--border-color);
    transition: all 0.3s ease;
    text-decoration: none;
}
.contact-links a:hover {
    color: var(--accent-color);
    transform: scale(1.1);
}
h2 {
    font-size: 1.8em;
    margin-top: 50px;
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
}
h2::before, h2::after {
    content: '〰';
    color: var(--border-color);
    font-weight: normal;
    transition: color 0.5s ease;
}
.bio-section {
    font-size: 1.2em;
    text-align: center;
    margin-bottom: 50px;
    padding: 0 20px;
}
.projects-list {
    list-style-type: none;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
}
.projects-list li {
    width: 100%;
    max-width: 400px;
}
.projects-list a {
    display: block;
    padding: 12px 20px;
    border: 1px solid var(--border-color);
    background-color: transparent;
    color: var(--text-color);
    text-decoration: none;
    font-size: 1.2em;
    text-align: center;
    transition: all 0.4s ease;
    position: relative;
    box-shadow: 0 4px 6px rgba(0,0,0,0.02);
}
.projects-list a:hover {
    background-color: var(--border-color);
    color: var(--bg-color);
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}
.toggle-btn {
    position: fixed;
    top: 25px;
    right: 25px;
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-color);
    padding: 10px 18px;
    cursor: pointer;
    font-family: inherit;
    font-size: 1.3em;
    transition: all 0.3s ease;
    z-index: 100;
    outline: none;
}
.toggle-btn:hover {
    background: var(--border-color);
    color: var(--bg-color);
}
.loading-text {
    font-style: italic;
    color: var(--text-color);
    opacity: 0.7;
    text-align: center;
    width: 100%;
    border: none !important;
}
</style>
</head>
<body>
<button class="toggle-btn" id="theme-btn">☾</button>
<div class="cv-container">
    <h1>Mahmoud El Sheikh</h1>
    <div class="alias">arcalc</div>
    
    <div class="contact-links">
        <a href="mailto:arcalc@proton.me"><i class="fas fa-envelope"></i></a>
        <a href="https://wa.me/"><i class="fab fa-whatsapp"></i></a>
        <a href="https://t.me/"><i class="fab fa-telegram-plane"></i></a>
    </div>

    <div class="bio-section">
        <p>Student at the Faculty of Science, Menofia University (Mathematics and Statistics).</p>
        <p>Specialized in Systems Programming and Cybersecurity.</p>
    </div>

    <div>
        <h2>Projects</h2>
        <ul id="projects-list" class="projects-list">
            <li class="loading-text" id="loading">Retrieving archives...</li>
        </ul>
    </div>
</div>
<script>
    const btn = document.getElementById('theme-btn');
    btn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        if(currentTheme === 'dark') {
            document.documentElement.removeAttribute('data-theme');
            btn.innerHTML = '☾';
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            btn.innerHTML = '☀';
        }
    });

    const githubUsername = 'mahmoudelsheikh7';
    const githubRepo = 'PCW';
    const folderPath = '';

    async function fetchGithubProjects() {
        const listElement = document.getElementById('projects-list');
        const loadingElement = document.getElementById('loading');
        const apiUrl = `https://api.github.com/repos/${githubUsername}/${githubRepo}/contents/${folderPath}`;

        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error('Error');
            
            const files = await response.json();
            loadingElement.style.display = 'none';

            let validFiles = files.filter(file => file.type === 'file' && 
                                           file.name !== 'index.html' && 
                                           (file.name.endsWith('.html') || file.name.endsWith('.md') || file.name.endsWith('.txt')));

            if (validFiles.length === 0) {
                listElement.innerHTML = '<li class="loading-text">No archives found.</li>';
                return;
            }

            // خوارزمية لخلط ترتيب المشاريع عشوائياً
            for (let i = validFiles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [validFiles[i], validFiles[j]] = [validFiles[j], validFiles[i]];
            }

            for (const file of validFiles) {
                let cleanName = file.name.replace(/\.[^/.]+$/, "");
                let finalName = cleanName.replace(/_/g, " ");

                const listItem = document.createElement('li');
                const linkItem = document.createElement('a');
                
                linkItem.target = "_blank";
                linkItem.textContent = finalName;

                if (file.name.endsWith('.txt')) {
                    try {
                        const txtResponse = await fetch(file.download_url);
                        const txtContent = await txtResponse.text();
                        linkItem.href = txtContent.trim(); 
                    } catch (e) {
                        linkItem.href = `https://${githubUsername}.github.io/${githubRepo}/${file.path}`;
                    }
                } else {
                    linkItem.href = `https://${githubUsername}.github.io/${githubRepo}/${file.path}`;
                }

                listItem.appendChild(linkItem);
                listElement.appendChild(listItem);
            }

        } catch (error) {
            listElement.innerHTML = `<li class="loading-text">Failed to access archives.</li>`;
        }
    }

    document.addEventListener('DOMContentLoaded', fetchGithubProjects);
</script>
</body>
</html>
